# Temporary CI job, removed after generating the pinned package-lock.
name: Sync Hybrid Billing PG Driver Lockfile
on:
  pull_request:
    branches: [main]
    paths: ['package.json']
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.head_ref == 'feature/hybrid-postgres-billing' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-postgres-billing
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(billing): sync PostgreSQL driver package lock"
          git push origin HEAD:feature/hybrid-postgres-billing
