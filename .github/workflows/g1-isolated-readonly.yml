name: G1 read-only code-only production release contract
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/growth/g1/**"
      - "lib/growth/g2/**"
      - "tests/g2/**"
      - "lib/growth/g3/**"
      - "lib/growth/g5/**"
      - "tests/g5/**"
      - "app/vendor/leads/page.tsx"
      - "app/vendor/reviews/page.tsx"
      - "tests/g3/**"
      - "app/vendor/components/G3PortfolioActions.tsx"
      - "app/vendor/vendor-workspace.css"
      - "app/vendor/settings/page.tsx"
      - "app/vendor/layout.tsx"
      - "app/vendor/components/G2ListingContentChecklist.tsx"
      - "app/vendor/components/G2GrowthScorePanel.tsx"
      - "app/api/vendor/g2-growthscore/**"
      - "app/vendor/dashboard/page.tsx"
      - "app/vendor/marketing/brand/page.tsx"
      - "app/vendor/components/G1BusinessKnowledgePanel.tsx"
      - "tests/g1/**"
      - "docs/growth/g0/exit/G0_OWNER_SCOPED_DECISIONS_20261124.json"
      - ".github/workflows/g1-isolated-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: G0 owner scoped authorization and immutable exit status
        run: node --test tests/g1/owner-decisions.test.mjs
      - name: G1 synthetic owner-A/B knowledge allowlist / no provider calls
        run: bun test tests/g1/read-only-knowledge.test.mjs tests/g1/knowledge-resolver-contract.test.mjs tests/g1/isolated-ssr-read-adapter.test.mjs

      - name: G2-01 observed listing checklist and next-action contract
        run: bun test tests/g2/listing-content-checklist.test.mjs

      - name: G2-02 deterministic GrowthScore and tenant boundary
        run: bun test tests/g2/growth-score.test.mjs

      - name: G2-02 real dashboard and SSR owner-only route integration
        run: node --test tests/g2/growthscore-live-integration.test.mjs

      - name: G3-01 deterministic portfolio actions and edge cases
        run: bun test tests/g3/portfolio-actions.test.mjs

      - name: G3-01 command center and mobile viewport CSS contract
        run: node --test tests/g3/command-center-responsive.test.mjs

      - name: G5-01 deterministic LeadIQ and reputation queue
        run: bun test tests/g5/intelligence-queues.test.mjs

      - name: G5-01 owner CRM and narrow mobile Settings integration
        run: node --test tests/g5/live-ux-contract.test.mjs

      - name: G5-02 follow-up worklist and trilingual manual guidance domain tests
        run: bun test tests/g5/followup-response-guidance.test.mjs

      - name: G5-02 real owner CRM and safe review guidance UI contract
        run: node --test tests/g5/followup-response-live-ux.test.mjs

      - name: G1 live three-page SSR read-only integration static security contract
        run: node --test tests/g1/live-page-integration.test.mjs
