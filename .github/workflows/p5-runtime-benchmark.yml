name: P5 Runtime Benchmark — Node and Bun
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
      - name: Node runtime benchmark
        run: node --experimental-strip-types scripts/p5-runtime-benchmark.mjs | tee p5-node.json
      - name: Bun runtime benchmark
        run: bun scripts/p5-runtime-benchmark.mjs | tee p5-bun.json
      - name: Validate reports
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for(const name of ['node','bun']){const r=JSON.parse(fs.readFileSync('p5-'+name+'.json','utf8'));if(r.runtime!==name||r.native.errors||r.hono.errors||r.native.count!==2000||r.hono.count!==2000)process.exit(1);}"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-runtime-benchmark
          path: p5-*.json
