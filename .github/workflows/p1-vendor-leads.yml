name: P1 Vendor Leads — CRM Follow-up Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/vendor/leads/**'
      - 'lib/growth/lead-followups.ts'
      - 'docs/growth/p1/P1_VENDOR_LEAD_FOLLOWUPS_REVIEW_ONLY.sql'
      - 'tests/vendorLeadFollowups.test.mjs'
      - '.github/workflows/p1-vendor-leads.yml'

permissions:
  contents: read

jobs:
  leads-crm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify follow-up scheduling, strict ownership and source labels
        run: node --test tests/vendorLeadFollowups.test.mjs tests/growthAttribution.test.mjs tests/vendorPortalRelease.test.mjs
