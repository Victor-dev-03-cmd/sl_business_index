name: G0 Foundation — Disposable integrity checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/growth/g0/**'
      - 'tests/g0/**'
      - 'scripts/g0/**'
      - 'lib/location/**'
      - 'tests/location/**'
      - '.github/workflows/g0-foundation-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        domain: [lead, review, review_public, billing, public_rpc, view_counter, chat]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slbi_g0
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d slbi_g0"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: slbi_g0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact release package contract
        run: node --test tests/g0/release-package.test.mjs
      - name: Secure enquiry RPC integration
        if: matrix.domain == 'lead'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/p0/security_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f tests/p0/ingestion_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/growth/SECURE_EVENT_INGESTION_REVIEW_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f docs/growth/SECURE_LEAD_SUBMISSION_REVIEW_ONLY.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions"
          psql -v ON_ERROR_STOP=1 -f docs/growth/g0/release/LEAD_RECOVERY_BASELINE.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f docs/growth/g0/release/LEAD_FORWARD_BODY.sql
          psql -v ON_ERROR_STOP=1 -f tests/p0/verify_ingestion.sql
          psql -v ON_ERROR_STOP=1 -f docs/growth/p0/P0_LEGACY_LEADS_STAGE_REVIEW_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f tests/p0/verify_legacy_leads.sql
          psql -v ON_ERROR_STOP=1 -c "TRUNCATE public.slbi_lead_request_receipts, public.slbi_lead_rate_limits"
          psql -v ON_ERROR_STOP=1 -f tests/g0/lead_replay.sql
          bash tests/g0/release_drift.sh lead
          psql -v ON_ERROR_STOP=1 -f tests/g0/lead_recovery.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/retention.sql
      - name: Reputation cache integration
        if: matrix.domain == 'review'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/p1-release/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091124_p1_vendor_lead_followups_and_review_owner_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091146_p1_review_moderation_pending_staff_audit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091046_p1_public_api_truncate_lockdown.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE public.businesses ADD COLUMN rating numeric DEFAULT 0, ADD COLUMN reviews_count integer DEFAULT 0"
          psql -v ON_ERROR_STOP=1 --single-transaction -f docs/growth/g0/release/REVIEW_FORWARD_BODY.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/review_cache.sql
          bash tests/g0/review_cache_concurrency.sh
          bash tests/g0/release_drift.sh review
          psql -v ON_ERROR_STOP=1 -f tests/g0/review_recovery.sql
      - name: G0-18 separate review public-moderation cache candidate
        if: matrix.domain == 'review_public'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/p1-release/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091124_p1_vendor_lead_followups_and_review_owner_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091146_p1_review_moderation_pending_staff_audit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113091046_p1_public_api_truncate_lockdown.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER TABLE public.businesses ADD COLUMN rating numeric DEFAULT 0, ADD COLUMN reviews_count integer DEFAULT 0"
          psql -v ON_ERROR_STOP=1 --single-transaction -f docs/growth/g0/candidates/REVIEW_PUBLIC_MODERATION_FORWARD_BODY.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/review_cache.sql
          bash tests/g0/review_cache_concurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/g0/review_public_contract.sql

      - name: Wallet entitlement and refund edge cases
        if: matrix.domain == 'billing'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/billing_v2/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110010000_growth_os_credit_foundation.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/billing_refund_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions"
          psql -v ON_ERROR_STOP=1 -f docs/growth/g0/release/WALLET_RECOVERY_BASELINE.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f docs/growth/g0/release/WALLET_FORWARD_BODY.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/billing_refund.sql
          bash tests/g0/release_drift.sh billing
          psql -v ON_ERROR_STOP=1 -f tests/g0/billing_recovery.sql

      - name: G0-15 isolated public RPC negative/baseline regression
        if: matrix.domain == 'public_rpc'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/g0/public_rpc_negative.sql

      - name: G0-03 hardened chat tenant boundary (disposable PG17 only)
        if: matrix.domain == 'chat'
        run: psql -v ON_ERROR_STOP=1 -f tests/g0/chat_tenant_boundary.sql
      - name: G0-16 verified view counter with isolated PostgreSQL security boundaries
        if: matrix.domain == 'view_counter'
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/p0/security_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f tests/p0/ingestion_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/growth/SECURE_EVENT_INGESTION_REVIEW_ONLY.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f docs/growth/g0/release/VIEW_COUNT_FORWARD_BODY.sql
          psql -v ON_ERROR_STOP=1 -f tests/g0/verified_view_counter.sql
          bash tests/g0/verified_view_concurrency.sh

  backup-copy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Validate backup-copy Bash syntax before any owner execution
        run: bash -n scripts/g0/verify-independent-backup-copy.sh
      - name: Synthetic backup-copy hash and unsafe path tests (no production bytes)
        run: bun test tests/g0/backup-copy.test.mjs tests/location/*.test.mjs
      - name: G0-17 verified view-counter flag and badge regression
        run: |
          bun test tests/g0/view-counter-mode.test.mjs
          node --test tests/business/verified-business-badge.test.mjs
          bun test tests/business/verified-business-gate.test.mjs
          bun scripts/g0/view-counter-staging-preflight.ts
      - name: Foundation exit gate cannot self-approve from CI
        run: bun test tests/g0/foundation-exit.test.mjs
