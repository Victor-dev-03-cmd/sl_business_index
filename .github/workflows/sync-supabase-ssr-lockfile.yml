name: One-time SSR dependency lockfile sync
on:
  push:
    branches: [fix/supabase-ssr-cookie-compat-20261110]
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit exact dependency resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(auth): lock @supabase/ssr 0.12.7'
            git push origin HEAD:fix/supabase-ssr-cookie-compat-20261110
          fi
