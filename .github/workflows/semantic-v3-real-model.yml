name: SemanticSearch v3 Real Model Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark-semantic-v3.py'
      - 'requirements-semantic-research.txt'
      - 'tests/fixtures/semantic-v3-category-proxy.json'
      - '.github/workflows/semantic-v3-real-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-multilingual-e5:
    name: Offline model-backed evaluation (research only)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-semantic-research.txt
      - name: Install pinned evaluation dependencies
        run: python -m pip install -r requirements-semantic-research.txt
      - name: Evaluate real multilingual embeddings against category-proxy labels
        run: |
          python scripts/benchmark-semantic-v3.py \
            --model intfloat/multilingual-e5-small \
            --model-revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            --max-queries 240 \
            --batch-size 16 \
            --query-mode raw \
            --output semantic-v3-raw-report.json
          python scripts/benchmark-semantic-v3.py \
            --model intfloat/multilingual-e5-small \
            --model-revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            --max-queries 240 \
            --batch-size 16 \
            --query-mode canonical \
            --output semantic-v3-canonical-report.json \
            --export-vectors semantic-v3-business-vectors.json \
            --export-beta-fixture semantic-v3-beta-vectors.ts
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v3-research-report
          path: |
            semantic-v3-*-report.json
            semantic-v3-business-vectors.json
            semantic-v3-beta-vectors.ts
          if-no-files-found: ignore
          retention-days: 7
