name: SemanticSearch v3 Real Model Research

on:
  push:
    branches:
      - research/semanticsearch-v3-evaluation-vector-gates-20261111
    paths:
      - 'scripts/benchmark-semantic-v3.py'
      - 'requirements-semantic-research.txt'
      - 'tests/fixtures/semantic-v3-category-proxy.json'
      - '.github/workflows/semantic-v3-real-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-multilingual-e5:
    name: Offline model-backed evaluation (research only)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-semantic-research.txt
      - name: Install pinned evaluation dependencies
        run: python -m pip install -r requirements-semantic-research.txt
      - name: Evaluate real multilingual embeddings against category-proxy labels
        run: |
          python scripts/benchmark-semantic-v3.py \
            --model intfloat/multilingual-e5-small \
            --model-revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            --max-queries 240 \
            --batch-size 16 \
            --query-mode raw \
            --output semantic-v3-raw-report.json
          python scripts/benchmark-semantic-v3.py \
            --model intfloat/multilingual-e5-small \
            --model-revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            --max-queries 240 \
            --batch-size 16 \
            --query-mode canonical \
            --output semantic-v3-canonical-report.json \
            --export-vectors semantic-v3-business-vectors.json \
            --export-beta-fixture semantic-v3-beta-vectors.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish revision-pinned beta vectors (research branch only)
        run: |
          set -euo pipefail
          cp semantic-v3-beta-vectors.ts lib/discovery/semantic-v3-beta-vectors.ts
          node --experimental-strip-types --test tests/semanticBetaV3.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/discovery/semantic-v3-beta-vectors.ts
          if ! git diff --cached --quiet; then
            git commit -m "data(research): publish verified E5 beta embeddings for six canonical intents"
            git push origin HEAD:refs/heads/research/semanticsearch-v3-evaluation-vector-gates-20261111
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v3-research-report
          path: |
            semantic-v3-*-report.json
            semantic-v3-business-vectors.json
            semantic-v3-beta-vectors.ts
          if-no-files-found: ignore
          retention-days: 7
