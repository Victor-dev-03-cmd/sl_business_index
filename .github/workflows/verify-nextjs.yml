name: Verify Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synthetic SSR multi-chunk cookie round-trip
        run: node tests/auth/ssr-cookie-roundtrip.mjs
      - name: Nearby GeoRank unit tests
        run: node --experimental-strip-types --test tests/geoRank.test.mjs tests/diagnostics.test.mjs tests/smartSearch.test.mjs tests/searchEvaluation.test.mjs tests/hybridSearch.test.mjs tests/searchDictionary.test.mjs tests/searchCorrections.test.mjs tests/semanticSearchV3.test.mjs tests/semanticV3Evaluation.test.mjs tests/semanticBetaV3.test.mjs tests/nearbySemanticDefault.test.mjs tests/growthAttribution.test.mjs tests/growthIngestion.test.mjs tests/growthSecureLeads.test.mjs tests/vendorPortalRelease.test.mjs tests/qrAssignmentRelease.test.mjs tests/vendorSettingsQrMarketing2026.test.mjs tests/vendorNeutralUi.test.mjs
      - name: Public mobile home reference, real navigation and bookmark persistence
        run: node --experimental-strip-types --test tests/publicMobileHomeReference.test.mjs
      - name: Nearby mobile results, compact cards and single native navigator
        run: node --experimental-strip-types --test tests/nearbyMobileLayout.test.mjs
      - name: SLBI HybridSearch v2 multilingual relevance benchmark (168 cases)
        run: node --experimental-strip-types tests/hybridBenchmark.mjs
      - name: User-reported Tamil Sinhala search intent evaluation
        run: node --experimental-strip-types tests/userReportedSearchEvaluation.mjs
      - name: Free Campaign Planner + direct Gallery navigation regression
        run: node --experimental-strip-types --test tests/p2CampaignPlannerFreeUX.test.mjs
      - name: G1-07 free Planner owner facts and privacy regression
        run: node --experimental-strip-types --test tests/p2CampaignPlannerG1Facts.test.mjs
      - name: G1-08 manual caption share, cancellation and desktop fallback regression
        run: node --experimental-strip-types --test tests/p2CampaignPlannerManualShare.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Anonymous protected-route smoke tests
        run: bash tests/route-smoke.sh
