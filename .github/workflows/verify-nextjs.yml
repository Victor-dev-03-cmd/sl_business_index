name: Verify Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synthetic SSR multi-chunk cookie round-trip
        run: node tests/auth/ssr-cookie-roundtrip.mjs
      - name: Nearby GeoRank unit tests
        run: node --experimental-strip-types --test tests/geoRank.test.mjs tests/diagnostics.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Anonymous protected-route smoke tests
        run: bash tests/route-smoke.sh
