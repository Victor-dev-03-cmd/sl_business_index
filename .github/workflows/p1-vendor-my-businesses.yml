name: P1 Vendor My Businesses Reliability
on:
  push:
    branches: [p1/vendor-my-businesses-reliability-20261113]
    paths:
      - '.github/workflows/p1-vendor-my-businesses.yml'
      - 'app/vendor/my-businesses/**'
      - 'tests/vendorMyBusinessesReliability.test.mjs'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck vendor edit form and integration types
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Verify listing edit, authorization, upload rollback and form-source contracts
        run: node --test tests/vendorMyBusinessesReliability.test.mjs
