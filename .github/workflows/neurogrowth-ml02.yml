name: NeuroGrowth ML-02 Deepnote research contract
on:
  pull_request:
    paths:
      - 'ml/neurogrowth/**'
      - 'tests/ml/neurogrowth-ml02-deepnote.test.mjs'
      - '.github/workflows/neurogrowth-ml02.yml'
      - 'docs/growth/HANDOFF_LATEST.md'
  workflow_dispatch:
jobs:
  notebook-and-privacy-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ml/neurogrowth-ml02-deepnote.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          import ast,json,pathlib
          root=pathlib.Path('ml/neurogrowth')
          ast.parse((root/'train.py').read_text())
          nb=json.loads((root/'notebooks/neurogrowth_ml02_deepnote.ipynb').read_text())
          for cell in nb['cells']:
              if cell['cell_type']=='code':
                  ast.parse(''.join(cell['source']))
          print('All Deepnote research cells parse; no GPU run or vendor evaluation claimed')
          PY
