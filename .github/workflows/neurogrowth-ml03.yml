name: NeuroGrowth ML-03 synthetic evaluation
on:
  pull_request:
    paths:
      - 'ml/neurogrowth/ml03_evaluate.py'
      - 'ml/neurogrowth/contracts/ml03_consent_label_contract.json'
      - 'ml/neurogrowth/tests/test_ml03_evaluate.py'
      - '.github/workflows/neurogrowth-ml03.yml'
  workflow_dispatch:
jobs:
  synthetic-isolation-and-baselines:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2'
      - run: PYTHONPATH=ml/neurogrowth python -m unittest discover -s ml/neurogrowth/tests -p test_ml03_evaluate.py -v
      - run: python ml/neurogrowth/ml03_evaluate.py --businesses 120
