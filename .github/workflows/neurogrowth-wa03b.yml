name: WA-03B official Meta sandbox callback security
on:
  pull_request:
    paths:
      - 'lib/growth/agent/wa03b-test-webhook.mjs'
      - 'lib/growth/agent/wa03b-test-webhook.d.mts'
      - 'app/api/integrations/whatsapp/webhook/route.ts'
      - 'tests/ml/wa03b-meta-sandbox-webhook.test.mjs'
      - '.github/workflows/neurogrowth-wa03b.yml'
      - 'docs/growth/HANDOFF_LATEST.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-test-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lib/growth/agent/wa03b-test-webhook.mjs
      - run: node --test tests/ml/wa03b-meta-sandbox-webhook.test.mjs
