name: NeuroGrowth WA-03 vendor connection UI preview safety
on:
  pull_request:
    paths:
      - 'app/vendor/marketing/whatsapp/**'
      - 'app/vendor/marketing/components/WhatsAppConnectionLab.tsx'
      - 'app/vendor/marketing/engine/(pro)/connections/page.tsx'
      - 'app/vendor/marketing/page.tsx'
      - 'tests/wa03WhatsAppConnectionLab.test.mjs'
      - '.github/workflows/neurogrowth-wa03.yml'
      - 'docs/growth/HANDOFF_LATEST.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-owned-business-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute WA-03 ownership and no-live-connection contract
        run: node --test tests/wa03WhatsAppConnectionLab.test.mjs
